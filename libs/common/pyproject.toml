[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memorial-common"
version = "1.0.0"
description = "Shared building blocks for the memorial services"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "aiosqlite==0.22.1",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pyjwt[crypto]==2.15.1",
  "redis==8.1.0",
  "httpx==0.28.1",
  "prometheus-fastapi-instrumentator==8.1.0",
]

[tool.setuptools]
packages = ["memorial_common"]
