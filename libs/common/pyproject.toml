[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memorial-common"
version = "1.0.0"
description = "Shared building blocks for the memorial services"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pyjwt[crypto]==2.10.1",
  "redis==5.2.1",
  "httpx==0.28.1",
  "prometheus-fastapi-instrumentator==7.0.0",
]

[tool.setuptools]
packages = ["memorial_common"]
