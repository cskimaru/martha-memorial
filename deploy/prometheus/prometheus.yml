global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { site: martha-memorial }

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["web:8000"]
        labels: { service: web }
      - targets: ["auth:8000"]
        labels: { service: auth }
      - targets: ["memorial:8000"]
        labels: { service: memorial }
      - targets: ["media:8000"]
        labels: { service: media }
      - targets: ["contributions:8000"]
        labels: { service: contributions }
  - job_name: reconciler
    static_configs: [{ targets: ["contributions-worker:9100"], labels: { service: contributions-worker } }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: site
    metrics_path: /probe
    params: { module: [http_2xx] }
    file_sd_configs: [{ files: ["/etc/prometheus-targets/site.yml"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }
