groups:
  - name: availability
    rules:
      - alert: SiteDown
        expr: probe_success{job="site"} == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "The memorial website is not reachable from the internet." }
      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.service }} is down." }
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status="5xx"}[5m]))
            / clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of {{ $labels.service }} requests are failing." }
      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} p95 latency is above 2 seconds." }
      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="site"} - time() < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "The HTTPS certificate expires in under 14 days (automatic renewal may be failing)." }

  - name: platform
    rules:
      - alert: BackupMissing
        expr: time() - memorial_backup_last_success_timestamp_seconds > 30 * 3600
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "No successful backup in the last 30 hours." }
      - alert: BackupNeverRan
        expr: absent(memorial_backup_last_success_timestamp_seconds)
        for: 30h
        labels: { severity: critical }
        annotations: { summary: "No backup has ever completed." }
      - alert: DiskFillingUp
        expr: node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Less than 15% disk space left on the server." }
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Server memory is over 90% used." }
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "The database is not responding." }
      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "The database has an unusual number of connections." }
