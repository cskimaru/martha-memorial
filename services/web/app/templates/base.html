<!doctype html>
<html lang="en" data-palette="{{ theme | default('plum') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}Martha Kemunto Ongosi{% endblock %}</title>
<meta name="color-scheme" content="light dark">
{% block meta %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/site.css?v={{ asset_version }}">
<link rel="icon" href="/static/candle.svg" type="image/svg+xml">
</head>
<body>
{% block body %}{% endblock %}
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/api.js?v={{ asset_version }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
