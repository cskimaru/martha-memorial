version: 2
updates:
  - package-ecosystem: pip
    directories: ["/libs/common", "/services/auth", "/services/memorial", "/services/media", "/services/web", "/"]
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: ["/deploy/docker", "/deploy/backup"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
